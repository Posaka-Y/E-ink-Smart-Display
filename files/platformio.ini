[env:esp32-c3-supermini]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino

; シリアルモニタ
monitor_speed = 115200

; ビルドフラグ
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ライブラリ
lib_deps =
    zinggjm/GxEPD2                      ; e-ink制御
    adafruit/Adafruit BME280 Library     ; 温湿度気圧センサ
    adafruit/Adafruit Unified Sensor     ; BME280の依存
    bblanchon/ArduinoJson                ; JSON パース（Calendar API レスポンスなど）
    arduino-libraries/NTPClient          ; NTP時刻同期
    arduino-libraries/Arduino_ConnectionHandler
