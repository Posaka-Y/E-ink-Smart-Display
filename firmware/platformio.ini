; PlatformIO Project Configuration — ESP32 DevKit (WROOM) + Waveshare 5.79" e-Paper (B)
; Primary target: ESP32 DevKit  (ESP32-S3 / ESP32-C3 envs kept as alternatives)
[platformio]
; GNU ld.exe cannot open files in non-ASCII paths (Japanese "趣味" in project path).
; Redirect the build output to an ASCII-only location.
build_dir = C:/pio-build/eink-display
default_envs = esp32dev

[env:esp32s3_devkitc1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = huge_app.csv

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_ESP32S3_DEVKITC1
    -IC:/Users/posak/.platformio/packages/framework-arduinoespressif32-libs/esp32s3/include/wpa_supplicant/esp_supplicant/include

upload_speed    = 921600
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

build_src_filter =
    +<*>
    -<wifi_debug.cpp>
    -<cal_debug.cpp>
    -<sensor_debug.cpp>
    -<display_test.cpp>
    -<DEV_Config.cpp>
    -<EPD_5in79b.cpp>
    -<GUI_Paint.cpp>
    -<calendar.cpp>
    -<font*.cpp>

lib_deps =
    adafruit/Adafruit AHTX0 @ ^2.0.5
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    arduino-libraries/NTPClient @ ^3.2.1
    bblanchon/ArduinoJson @ ^7.0.0
    zinggjm/GxEPD2

