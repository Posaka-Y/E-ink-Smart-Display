; PlatformIO Project Configuration — ESP32-C3 Supermini + Waveshare 5.79" e-Paper (B)
[platformio]
; GNU ld.exe cannot open files in non-ASCII paths (Japanese "趣味" in project path).
; Redirect the build output to an ASCII-only location.
build_dir = C:/pio-build/eink-display

[env:esp32c3_supermini]
platform  = espressif32
board     = seeed_xiao_esp32c3
framework = arduino

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -IC:/Users/posak/.platformio/packages/framework-arduinoespressif32-libs/esp32c3/include/wpa_supplicant/esp_supplicant/include

upload_speed    = 921600
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    adafruit/Adafruit AHTX0 @ ^2.0.5
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    arduino-libraries/NTPClient @ ^3.2.1
    bblanchon/ArduinoJson @ ^7.0.0

; ── WiFi単体デバッグ環境 ─────────────────────────────────────────────────────
[env:wifi_debug]
platform  = espressif32
board     = seeed_xiao_esp32c3
framework = arduino

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=5
    -IC:/Users/posak/.platformio/packages/framework-arduinoespressif32-libs/esp32c3/include/wpa_supplicant/esp_supplicant/include

; このファイルだけビルド（メインアプリのソースを除外）
build_src_filter = -<*> +<wifi_debug.cpp>

upload_speed  = 921600
monitor_speed = 115200
