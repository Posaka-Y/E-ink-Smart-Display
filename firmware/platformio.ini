; PlatformIO Project Configuration — ESP32-C3 Supermini + Waveshare 5.79" e-Paper (B)
[platformio]
; GNU ld.exe cannot open files in non-ASCII paths (Japanese "趣味" in project path).
; Redirect the build output to an ASCII-only location.
build_dir = C:/pio-build/eink-display

[env:esp32c3_supermini]
platform  = espressif32
board     = seeed_xiao_esp32c3
framework = arduino

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -IC:/Users/posak/.platformio/packages/framework-arduinoespressif32-libs/esp32c3/include/wpa_supplicant/esp_supplicant/include

upload_speed    = 921600
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    adafruit/Adafruit AHTX0 @ ^2.0.5
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    arduino-libraries/NTPClient @ ^3.2.1
    bblanchon/ArduinoJson @ ^7.0.0

; ── Wi-Fi 接続確認環境 ────────────────────────────────────────────────────────
[env:wifi_debug]
platform  = espressif32
board     = seeed_xiao_esp32c3
framework = arduino

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -IC:/Users/posak/.platformio/packages/framework-arduinoespressif32-libs/esp32c3/include/wpa_supplicant/esp_supplicant/include

build_src_filter =
    -<*>
    +<wifi_debug.cpp>

upload_speed  = 921600
monitor_speed = 115200

; ── カレンダー・Gemini デバッグ環境 ───────────────────────────────────────────
[env:cal_debug]
platform  = espressif32
board     = seeed_xiao_esp32c3
framework = arduino

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -IC:/Users/posak/.platformio/packages/framework-arduinoespressif32-libs/esp32c3/include/wpa_supplicant/esp_supplicant/include

build_src_filter =
    -<*>
    +<cal_debug.cpp>
    +<googlecal.cpp>

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

upload_speed  = 921600
monitor_speed = 115200

; ── センサーデバッグ環境 ────────────────────────────────────────────────────────
[env:sensor_debug]
platform  = espressif32
board     = seeed_xiao_esp32c3
framework = arduino

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

build_src_filter =
    -<*>
    +<sensor_debug.cpp>

lib_deps =
    adafruit/Adafruit AHTX0 @ ^2.0.5
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14

upload_speed  = 921600
monitor_speed = 115200

; ── ディスプレイ単体テスト環境 ────────────────────────────────────────────────
[env:display_test]
platform  = espressif32
board     = seeed_xiao_esp32c3
framework = arduino

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

build_src_filter =
    -<*>
    +<display_test.cpp>

lib_deps =
    zinggjm/GxEPD2

upload_speed  = 921600
monitor_speed = 115200

